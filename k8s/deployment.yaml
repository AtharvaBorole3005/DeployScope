apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployscope
  labels:
    app.kubernetes.io/name: deployscope
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: deployscope
  template:
    metadata:
      labels:
        app.kubernetes.io/name: deployscope
    spec:
      containers:
        - name: deployscope
          image: docker.io/your-dockerhub-username/deployscope:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
              protocol: TCP
          env:
            - name: APP_VERSION
              value: "0.1.0-local"
            - name: BUILD_NUMBER
              value: "unavailable"
            - name: GIT_COMMIT
              value: "unknown"
            - name: REPOSITORY_URL
              value: "Not configured"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
